services:
  cosmos:
    build:
      context: .
      args:
        NASA_API_KEY: ${NASA_API_KEY}
    ports:
      - "4947:4947"
    environment:
      - NASA_API_KEY=${NASA_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4947/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
